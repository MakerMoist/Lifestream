name: Dependency checksums (one-off)

on:
  push:
    branches: [ windows-meta ]

permissions:
  contents: read

jobs:
  checksums:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Write checksums
        shell: bash
        run: |
          chmod +x ./gradlew
          if [ "$RUNNER_OS" = "Windows" ]; then T="test createDistributable packageMsi"; else T="test createDistributable"; fi
          ./gradlew --no-daemon --write-verification-metadata sha256 $T
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metadata-${{ matrix.os }}
          path: gradle/verification-metadata.xml
