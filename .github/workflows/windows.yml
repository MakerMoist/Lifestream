name: LifeStream for Windows

# Builds and tests the Windows app on every push to the windows branch. It's published (as its
# own "windows-latest" release on the same releases page, leaving the Android release alone) only
# when the commit message asks for it with [release].
on:
  push:
    branches: [ windows ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Compile and test
        run: |
          chmod +x ./gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon test 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -E '^e: |FAILED|Exception|expected' "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/^/::error::/' || true
            exit 1
          fi
          grep -E "LSTEST" "$RUNNER_TEMP/gradle.log" | sed -E 's/^.*LSTEST //' | sort -u | head -40 | sed 's/^/::notice::/' || true

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run the tests on Windows too
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon test *> test.log
          $ok = $LASTEXITCODE -eq 0
          Get-Content test.log | Select-String "LSTEST" | ForEach-Object { "::notice::Windows " + ($_.Line -replace '^.*LSTEST ', '') } | Sort-Object -Unique
          if (-not $ok) { Get-Content test.log -Tail 80 | ForEach-Object { Write-Output $_ }; Get-Content test.log | Select-String -Pattern '^e: |FAILED|Exception|expected|went wrong|Could not' | Select-Object -First 40 | ForEach-Object { "::error::" + $_.Line }; exit 1 }
      - name: Build the installer and the portable app
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon packageMsi createDistributable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force out | Out-Null
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName out/LifeStream-Windows-Setup.msi
          Compress-Archive -Path build/compose/binaries/main/app/LifeStream -DestinationPath out/LifeStream-Windows-Portable.zip
          $version = (Select-String -Path build.gradle.kts -Pattern 'val appVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $msiHash = (Get-FileHash out/LifeStream-Windows-Setup.msi -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash out/LifeStream-Windows-Portable.zip -Algorithm SHA256).Hash.ToLower()
          "$msiHash  LifeStream-Windows-Setup.msi" | Out-File -Encoding ascii out/LifeStream-Windows-Setup.msi.sha256
          "$zipHash  LifeStream-Windows-Portable.zip" | Out-File -Encoding ascii out/LifeStream-Windows-Portable.zip.sha256
          @{ versionName = $version; msiSha256 = $msiHash; zipSha256 = $zipHash } | ConvertTo-Json -Compress | Out-File -Encoding ascii out/version-windows.json
          Get-ChildItem out
      - name: Check an update keeps the saved songs
        shell: pwsh
        run: |
          # Install the version on the releases page now, give it some saved songs, then install
          # this build over it the way an update does, and see that they're still there.
          $old = Join-Path $env:RUNNER_TEMP "previous.msi"
          try { Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/windows-latest/LifeStream-Windows-Setup.msi" -OutFile $old -UseBasicParsing }
          catch { Write-Output "::notice::No earlier release to update from"; exit 0 }
          Start-Process msiexec.exe -ArgumentList "/i `"$old`" /qn" -Wait
          $cache = Join-Path $env:LOCALAPPDATA "LifeStream Cache/songs"
          New-Item -ItemType Directory -Force $cache | Out-Null
          Set-Content -Path (Join-Path $cache "AbCdEfGhIjK.140") -Value "saved song"
          $new = (Resolve-Path out/LifeStream-Windows-Setup.msi).Path
          Start-Process msiexec.exe -ArgumentList "/i `"$new`" /qn" -Wait
          if (Test-Path (Join-Path $cache "AbCdEfGhIjK.140")) { Write-Output "::notice::Updating kept the saved songs" }
          else { Write-Output "::error::Updating removed the saved songs"; exit 1 }
          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA "LifeStream") -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Output "::notice::Installed in LocalAppData\LifeStream: $($installed -join ', ')"
      - name: Start the app and check it keeps running
        shell: pwsh
        run: |
          $exe = "build/compose/binaries/main/app/LifeStream/LifeStream.exe"
          $env:LIFESTREAM_SELFTEST = "1"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 40
          $data = Join-Path $env:APPDATA "LifeStream"
          $crash = Join-Path $data "crash.log"
          if (Test-Path $crash) { Get-Content $crash | Select-Object -First 60 | ForEach-Object { Write-Output "::error::$_" } }
          $log = Join-Path $data "selftest.log"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Output "::notice::$_" } }
          # The window itself must be open (a launcher error box also keeps the process alive).
          $titles = Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { $_.MainWindowTitle }
          $opened = $titles -contains "LifeStream"
          $exited = $p.HasExited
          # Opening it again hands over to the running copy (which shows itself) and quits.
          $second = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($second.HasExited) { Write-Output "::notice::Opening it again brought the running copy forward and quit" }
          else { Write-Output "::error::A second copy kept running"; Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue; exit 1 }
          # A picture of the window, to check the layout.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots/window.png")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ((-not $opened) -or $exited) { Write-Output "::error::LifeStream's window didn't open (windows: $($titles -join ', '))"; exit 1 }
          Write-Output "::notice::LifeStream opened its window on Windows and kept running"
          # Once more in Compact View, on Settings, to check that layout too.
          Start-Sleep -Seconds 3
          '{"compact_view":true,"no_hardware_acceleration":true}' | Out-File -Encoding ascii (Join-Path $data "settings.json")
          $env:LIFESTREAM_SELFTEST = "settings"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots/compact-settings.png")
          if (Test-Path $log) { Get-Content $log | Select-String "Memory|Tray" | ForEach-Object { Write-Output "::notice::Without hardware acceleration: $($_.Line)" } }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LifeStream-Windows
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshot
          path: shots/
          if-no-files-found: ignore

  # Only this job can write to the repo, and only when a release was asked for.
  publish:
    needs: package
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LifeStream-Windows
      - name: Publish to the "windows-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version-windows.json'))['versionName'])")
          if ! gh release view windows-latest -R "$REPO" >/dev/null 2>&1; then
            gh release create windows-latest -R "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "LifeStream for Windows $VERSION" \
              --notes "LifeStream for Windows. Install with LifeStream-Windows-Setup.msi, or unzip LifeStream-Windows-Portable.zip and run LifeStream.exe. The .sha256 files are checksums."
          fi
          gh release upload windows-latest -R "$REPO" --clobber \
            LifeStream-Windows-Setup.msi LifeStream-Windows-Setup.msi.sha256 \
            LifeStream-Windows-Portable.zip LifeStream-Windows-Portable.zip.sha256 version-windows.json
          gh release edit windows-latest -R "$REPO" --title "LifeStream for Windows $VERSION"
          gh api -X PATCH "repos/$REPO/git/refs/tags/windows-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null || \
            echo "::warning::Couldn't move the windows-latest tag; the release itself is published."
