name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Least privilege by default: building only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      # Third-party actions are pinned to exact commits, so a moved tag can't change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The release key is committed only in encrypted form (app/signing/release.jks.enc) and is
      # decrypted here with the LIFESTREAM_KEYSTORE_PASSWORD secret. Without that secret — e.g. on
      # pull requests — the release APK is signed with a throwaway debug key and not published.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LIFESTREAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFESTREAM_KEY_ALIAS }}
        run: |
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          ALIAS=$(printf '%s' "${KEY_ALIAS:-lifestream}" | tr -d ' \t\r\n')
          if [ -z "$PW" ] || [ ! -f app/signing/release.jks.enc ]; then
            echo "::warning::Signing password secret not set; APK will be signed with a temporary key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! PW="$PW" openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
               -in app/signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PW 2>/dev/null; then
            echo "::error::LIFESTREAM_KEYSTORE_PASSWORD can't decrypt the signing key (${#PW} characters; it should be 32)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::LIFESTREAM_KEY_ALIAS isn't in the keystore (${#ALIAS} characters; it should be the word lifestream)."
            exit 1
          fi
          echo "LIFESTREAM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK (not debuggable)
        env:
          LIFESTREAM_VERSION_CODE: ${{ github.run_number }}
          # Build 94 is 1.6.10b; later builds count up from 1.6.11 (build 95). Before it: 83 = 1.6.0,
          # 84 = 1.6.1, 85-89 = 1.6.5-1.6.9, 90 / 91 = 1.6.9a / 1.6.9b, 92 = 1.6.10 and 93 = 1.6.10a
          # (a letter after a version is set below, per build).
          # (Earlier: 69 = 1.5.0, 64 = 1.4.5, 49 = 1.1.0, 50 = 1.1.5, 51 = 1.2.0, 53 = 1.3.0, 54 = 1.3.5, 56 = 1.3.7.)
          VERSION_PREFIX: "1.6"
          VERSION_BASE_RUN: 84
          LIFESTREAM_KEYSTORE_PASSWORD: ${{ secrets.LIFESTREAM_KEYSTORE_PASSWORD }}
          LIFESTREAM_KEY_ALIAS: ${{ secrets.LIFESTREAM_KEY_ALIAS }}
          LIFESTREAM_KEY_PASSWORD: ${{ secrets.LIFESTREAM_KEY_PASSWORD }}
        run: |
          if [ "$LIFESTREAM_VERSION_CODE" -ge "$VERSION_BASE_RUN" ]; then
            export LIFESTREAM_VERSION_NAME="$VERSION_PREFIX.$((LIFESTREAM_VERSION_CODE - VERSION_BASE_RUN))"
          else
            export LIFESTREAM_VERSION_NAME="1.0.$LIFESTREAM_VERSION_CODE"
          fi
          case "$LIFESTREAM_VERSION_CODE" in
            90) export LIFESTREAM_VERSION_NAME="1.6.9a" ;;
            91) export LIFESTREAM_VERSION_NAME="1.6.9b" ;;
            93) export LIFESTREAM_VERSION_NAME="1.6.10a" ;;
            94) export LIFESTREAM_VERSION_NAME="1.6.10b" ;;
          esac
          chmod +x ./gradlew
          # Compiler errors also go up as annotations, so they show on the run's summary page.
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -iE '^e: |error|missing class' "$RUNNER_TEMP/gradle.log" | head -30 | sed 's/^/::error::/' || true
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk Lifestream.apk
          sha256sum Lifestream.apk | tee Lifestream.apk.sha256
          # What the in-app updater reads to decide whether there's something newer.
          SHA=$(cut -d' ' -f1 Lifestream.apk.sha256)
          printf '{"versionCode": %s, "versionName": "%s", "sha256": "%s"}\n' \
            "$LIFESTREAM_VERSION_CODE" "$LIFESTREAM_VERSION_NAME" "$SHA" > version.json
          cat version.json

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lifestream-apk
          path: |
            Lifestream.apk
            Lifestream.apk.sha256
            version.json


  # Publishing is a separate job: only it can write to the repo, and only for pushes to main.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Lifestream-apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          gh release view latest -R "$REPO" >/dev/null 2>&1 || \
            gh release create latest -R "$REPO" --prerelease --title "LifeStream (latest build)" \
              --notes "Latest LifeStream build. Install Lifestream.apk; Lifestream.apk.sha256 is its checksum."
          gh release upload latest Lifestream.apk Lifestream.apk.sha256 version.json -R "$REPO" --clobber
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['versionName'])")
          gh release edit latest -R "$REPO" --title "LifeStream $VERSION"
          # Point the "latest" tag at the commit this build came from. The app only reads the
          # release's files, so if GitHub's API hiccups here it's retried, then just a warning.
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/$REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null; then
              break
            fi
            [ "$attempt" = 3 ] && echo "::warning::Couldn't move the latest tag; the release itself is published."
            sleep 10
          done
          # The old debug build is no longer published.
          gh release delete-asset latest app-debug.apk -R "$REPO" -y 2>/dev/null || true
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::Published APK is signed with a temporary key. Add the signing secrets so updates install over each other."
          fi
