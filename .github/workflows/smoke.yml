name: Smoke test

# Installs a release build (shrunk exactly like the published one) on an Android emulator,
# launches it and checks it keeps running without crashing, then runs the on-device feature tests. Runs when the smoke-test branch is
# pushed (nothing is published from there), or from the Actions tab.
on:
  push:
    branches: [ smoke-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same release build, with the x86_64 native libraries the emulator needs. Signed with the
      # debug key (no secrets are used here).
      - name: Build release APK
        env:
          LIFESTREAM_ALL_ABIS: "1"
        run: |
          chmod +x ./gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -iE '^e: |error|missing class' "$RUNNER_TEMP/gradle.log" | head -30 | sed 's/^/::error::/' || true
            exit 1
          fi

      # What the finished app contains (components and permissions from every library), so
      # anything unexpected, like a telemetry service, is visible in the run summary.
      - name: Report app components
        run: |
          M=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*" -path "*release*" | head -1)
          [ -n "$M" ] || { echo "::warning::Merged manifest not found"; exit 0; }
          python3 - "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}'
          app = ET.parse(sys.argv[1]).getroot()
          perms = sorted(e.get(A + 'name') for e in app.iter('uses-permission'))
          comps = []
          for tag in ('activity', 'service', 'receiver', 'provider'):
              for e in app.iter(tag):
                  metas = [m.get(A + 'name') for m in e.iter('meta-data')]
                  comps.append(f"{tag}: {e.get(A + 'name')} exported={e.get(A + 'exported')}" + (f" meta={metas}" if metas else ""))
          print("::notice::App permissions: " + ", ".join(perms))
          print("::notice::App components%0A" + "%0A".join(comps))
          PY

      # Then the on-device feature tests (built as a debug build with the same native libraries).
      # The emulator is started with Google's own SDK tools on the runner (no third-party action).
      - name: Start an Android emulator
        timeout-minutes: 20
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BIN="$SDK/cmdline-tools/latest/bin"
          ADB="$SDK/platform-tools/adb"
          IMAGE="system-images;android-34;google_apis;x86_64"
          LOG="$RUNNER_TEMP/emulator.log"
          # avdmanager and the emulator must agree on where the virtual device is kept.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          fail() {
            echo "::error::$1"
            tail -25 "$LOG" 2>/dev/null | sed 's/^/::error::emulator: /'
            exit 1
          }
          yes | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          timeout 600 "$BIN/sdkmanager" --install "platform-tools" "emulator" "$IMAGE" > "$RUNNER_TEMP/sdk.log" 2>&1 \
            || { tail -10 "$RUNNER_TEMP/sdk.log" | sed 's/^/::error::sdkmanager: /'; exit 1; }
          echo no | "$BIN/avdmanager" create avd --force -n smoke -k "$IMAGE" > /dev/null 2>&1 || fail "Couldn't create the emulator"
          nohup "$SDK/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -accel on -gpu swiftshader_indirect -camera-back none -camera-front none > "$LOG" 2>&1 &
          timeout 300 "$ADB" wait-for-device || fail "The emulator didn't come up"
          start=$SECONDS
          booted=""
          while [ $((SECONDS - start)) -lt 600 ]; do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          [ -n "$booted" ] || fail "The emulator didn't finish booting in 10 minutes"
          echo "::notice::Emulator booted in $((SECONDS - start)) s"
          for a in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$ADB" shell settings put global $a 0
          done
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Launch on the emulator and run the feature tests
        env:
          LIFESTREAM_ALL_ABIS: "1"
        run: bash .github/emulator.sh
