name: Soundtrack probe

# Runs the app's catalog + matching rules against YouTube Music and publishes report.md
# to the `probe-report` branch. Start it from the Actions tab (or the API).
on:
  workflow_dispatch:
    inputs:
      games:
        description: "Space-separated game ids to probe (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run probe
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p tools/probe run --args="${{ github.event.inputs.games }}"

      - name: Publish report
        run: |
          cp tools/probe/report.md "$RUNNER_TEMP/report.md"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan probe-report
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/report.md" report.md
          git add report.md
          git commit -m "Soundtrack probe report"
          git push -f origin probe-report
