name: Soundtrack probe

# Runs the app's catalog + matching rules against YouTube Music and publishes report.md
# to the `probe-report` branch. Start it from the Actions tab (or the API).
on:
  workflow_dispatch:
    inputs:
      games:
        description: "Space-separated game ids to probe (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run probe
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          GAMES="${{ github.event.inputs.games }}"
          if [ -n "$GAMES" ]; then
            ./gradlew --no-daemon -p tools/probe run --args="$GAMES" 2>&1 | tee "$RUNNER_TEMP/probe.log"
          else
            ./gradlew --no-daemon -p tools/probe run 2>&1 | tee "$RUNNER_TEMP/probe.log"
          fi

      - name: Publish report
        if: always()
        run: |
          if [ -f tools/probe/report.md ]; then cp tools/probe/report.md "$RUNNER_TEMP/report.md"; else echo "(no report)" > "$RUNNER_TEMP/report.md"; fi
          tail -n 400 "$RUNNER_TEMP/probe.log" > "$RUNNER_TEMP/probe-log.txt" || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan probe-report
          git rm -rf --quiet .
          cp "$RUNNER_TEMP/report.md" report.md
          cp "$RUNNER_TEMP/probe-log.txt" probe-log.txt
          git add report.md probe-log.txt
          git commit -m "Soundtrack probe report"
          git push -f origin probe-report
